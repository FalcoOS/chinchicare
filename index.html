<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#64765a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ChinchiCare">
<title>ChinchiCare · Chinchilla-Begleiter</title>
<style>
:root{--green:#64765a;--deep:#344735;--sage:#e8eee3;--cream:#faf8f2;--ink:#252b24;--muted:#6e766b;--line:#e4e7de;--white:#fff;--orange:#a85b25;--shadow:0 8px 28px #26351e0c}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;min-height:100vh}.top{padding:22px 24px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--cream);position:sticky;top:0;z-index:5;border-bottom:1px solid #e7e9e1}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:23px}.brand h1{font-size:20px;line-height:1.1;margin:0}.brand p{font-size:12px;color:var(--muted);margin:4px 0 0}.tag{border:1px solid #d9e0d3;background:#f1f4ed;border-radius:99px;padding:7px 11px;font-size:12px;color:var(--deep)}.layout{display:grid;grid-template-columns:220px 1fr;gap:26px;padding:24px}.nav{display:flex;flex-direction:column;gap:6px;position:sticky;top:100px;height:max-content}.nav button{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:12px;color:#596256;display:flex;align-items:center;gap:11px}.nav button.active{background:var(--sage);color:var(--deep);font-weight:650}.nav .ico{width:22px;text-align:center;font-size:18px}.content{min-width:0}.welcome{background:var(--deep);color:#fff;border-radius:22px;padding:25px 27px;display:flex;align-items:center;justify-content:space-between;gap:18px;overflow:hidden}.welcome h2{font-size:26px;line-height:1.15;margin:0 0 9px}.welcome p{margin:0;color:#e1e9dd;max-width:560px}.welcome .emoji{font-size:66px;opacity:.95}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:700;color:#d0ddc8;margin-bottom:9px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:27px 0 14px}.section-head h2{margin:0;font-size:20px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow)}.metric{display:flex;align-items:center;gap:12px}.metric-icon{width:42px;height:42px;border-radius:13px;background:var(--sage);display:grid;place-items:center;font-size:20px}.metric strong{display:block;font-size:23px;line-height:1.2}.metric span{font-size:12px;color:var(--muted)}.quick{display:flex;flex-direction:column;gap:8px}.quick button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;text-align:left;display:flex;gap:10px;align-items:center}.quick button:hover,.food:hover{border-color:#b9c7b0}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;font-size:11px;background:#edf2e8;color:#465d3f}.pill.warn{background:#fff1df;color:#8a4a13}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:0;background:var(--green);color:#fff;padding:10px 14px;border-radius:11px;font-weight:650}.btn.secondary{background:#eef2e9;color:var(--deep)}.btn.ghost{background:transparent;color:var(--green);border:1px solid #d9e0d3}.btn.danger{background:#fff0ed;color:#9d3427}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:12px;font-weight:650;color:#50594c}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #dfe4d9;background:#fff;border-radius:10px;padding:10px 11px;color:var(--ink);outline-color:#8da181}.field textarea{min-height:78px;resize:vertical}.search{margin-bottom:13px}.list{display:flex;flex-direction:column;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;background:#fff;border:1px solid var(--line);border-radius:13px}.item h3{font-size:14px;margin:0 0 3px}.item p{margin:0;font-size:12px;color:var(--muted)}.food-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.food{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:var(--ink)}.food h3{font-size:14px;margin:0 0 4px}.food p{font-size:12px;color:var(--muted);margin:0 0 9px}.notice{border-radius:13px;padding:13px 15px;background:#f3f4e9;border:1px solid #e2e6d8;color:#4e5c44;font-size:12px;margin:12px 0}.notice.warn{background:#fff5e8;border-color:#f2dfc5;color:#7b4a1e}.empty{padding:28px;text-align:center;border:1px dashed #d8ded1;border-radius:15px;color:var(--muted)}.pet-avatar{width:50px;height:50px;border-radius:16px;background:#edf0e7;display:grid;place-items:center;font-size:27px;flex-shrink:0}.pet-row{display:flex;align-items:center;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.footer{padding:0 24px 28px;text-align:center;font-size:11px;color:#838a7d}.mobile-nav{display:none}.modal-back{position:fixed;inset:0;background:#1c281d77;display:grid;place-items:center;padding:16px;z-index:10}.modal{background:var(--cream);border-radius:18px;padding:22px;width:min(500px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 15px;font-size:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#e9eee4;border-radius:9px;padding:6px 10px}.checkline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.checkline input{accent-color:var(--green);width:17px;height:17px}.hidden{display:none!important}
@media(max-width:800px){.layout{display:block;padding:17px 15px 95px}.nav{display:none}.top{padding:15px}.tag{display:none}.welcome{padding:22px}.welcome h2{font-size:23px}.welcome .emoji{font-size:48px}.grid{grid-template-columns:1fr 1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:8;justify-content:space-around}.mobile-nav button{border:0;background:transparent;color:#65705f;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 3px;min-width:50px}.mobile-nav button.active{color:var(--deep);font-weight:700}.mobile-nav span{font-size:20px}.two{grid-template-columns:1fr}.food-grid{grid-template-columns:1fr}.section-head{margin-top:22px}.welcome p{font-size:13px}.welcome .emoji{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo">🐭</div><div><h1>ChinchiCare</h1><p>Dein Begleiter für gute Chinchilla-Haltung</p></div></div>
  <span class="tag">Prototyp · kostenlos</span>
</header>
<div class="layout">
  <nav class="nav" id="sideNav"></nav>
  <main class="content" id="view"></main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div class="footer">ChinchiCare · Früher Prototyp · Daten werden nur in diesem Browser gespeichert</div>
</div>
<div id="modalRoot"></div>
<script>
const navItems=[
 {id:"home",icon:"⌂",label:"Übersicht"},
 {id:"food",icon:"♧",label:"Futterlexikon"},
 {id:"care",icon:"✓",label:"Pflegekalender"},
 {id:"pets",icon:"♡",label:"Meine Chinchillas"},
 {id:"cage",icon:"▦",label:"Käfigplanung"},
 {id:"guide",icon:"✳",label:"Haltungswissen"}
];
const foods=[
 {name:"Heu",group:"Grundversorgung",status:"Grundlage",tone:"good",desc:"Hochwertiges, trockenes Heu sollte als faserreiche Grundlage ständig verfügbar sein.",detail:"Auf trockene, saubere Lagerung achten. Staubiges, feuchtes oder schimmeliges Heu nicht verfüttern.",source:"Allgemeine Haltungsorientierung, fachliche Quellenprüfung vor Veröffentlichung erforderlich."},
 {name:"Frisches Trinkwasser",group:"Grundversorgung",status:"Täglich",tone:"good",desc:"Sauberes Trinkwasser muss jederzeit verfügbar sein.",detail:"Trinkgefäß täglich kontrollieren und reinigen. Wasserflasche auf Funktion und Dichtigkeit prüfen.",source:"Allgemeine Haltungsorientierung."},
 {name:"Chinchilla-Pellets",group:"Futtermittel",status:"Geeignet bei passender Zusammensetzung",tone:"good",desc:"Ein geeignetes Alleinfutter kann ergänzend zur Heuversorgung eingesetzt werden.",detail:"Zusammensetzung und Fütterungsempfehlung des Herstellers prüfen. Futterwechsel schrittweise durchführen.",source:"Individuelle Futtermenge bei Bedarf tierärztlich abstimmen."},
 {name:"Getrocknete Kräuter",group:"Ergänzung",status:"Art und Menge prüfen",tone:"warn",desc:"Nicht jede Pflanze ist für Chinchillas geeignet.",detail:"Nur sicher bestimmte, geeignete Arten anbieten. Keine unbekannten Pflanzen oder feuchten, verdorbenen Bestandteile verfüttern.",source:"Pflanzenfreigabe muss vor Veröffentlichung fachlich geprüft werden."},
 {name:"Obst und süße Snacks",group:"Vorsicht",status:"Nicht als Routine-Snack",tone:"warn",desc:"Zuckerreiche Leckerchen sind für Chinchillas keine geeignete tägliche Belohnung.",detail:"Bei Ernährungsfragen auf faserreiche, chinchillageeignete Kost setzen. Individuelle Risiken tierärztlich abklären.",source:"Konservative Orientierung, keine individuelle Ernährungsberatung."},
 {name:"Unbekannte Zimmerpflanzen",group:"Vermeiden",status:"Nicht anbieten",tone:"warn",desc:"Unbekannte Pflanzen können gesundheitsschädlich sein.",detail:"Pflanzen erst nach zuverlässiger Bestimmung und Prüfung auf Eignung verwenden.",source:"Im Zweifel nicht verfüttern und tierärztlichen Rat einholen."}
];
const defaultTasks=[
 {id:1,title:"Frisches Wasser kontrollieren",category:"Täglich",due:todayISO(),done:false},
 {id:2,title:"Heu und Futtervorrat prüfen",category:"Täglich",due:todayISO(),done:false},
 {id:3,title:"Verhalten und Appetit beobachten",category:"Täglich",due:todayISO(),done:false},
 {id:4,title:"Gehege und Einrichtung kontrollieren",category:"Wöchentlich",due:todayISO(),done:false}
];
function todayISO(){return new Date().toISOString().slice(0,10)}
function read(key,fallback){try{const v=localStorage.getItem("chinchicare_"+key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function save(key,val){localStorage.setItem("chinchicare_"+key,JSON.stringify(val))}
let pets=read("pets",[]), tasks=read("tasks",defaultTasks), cage=read("cage",{width:"",depth:"",height:"",notes:""}), active="home", foodQuery="";
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function navHTML(){return navItems.map(n=>`<button class="${active===n.id?'active':''}" onclick="go('${n.id}')"><span class="ico">${n.icon}</span>${n.label}</button>`).join("")}
function renderNav(){document.getElementById("sideNav").innerHTML=navHTML();document.getElementById("mobileNav").innerHTML=navItems.filter(n=>["home","food","care","pets","cage"].includes(n.id)).map(n=>`<button class="${active===n.id?'active':''}" onclick="go('${n.id}')"><span>${n.icon}</span>${n.label}</button>`).join("")}
function go(id){active=id;render()}
function header(title,sub,action=""){return `<div class="section-head"><div><h2>${title}</h2><p>${sub}</p></div>${action}</div>`}
function render(){
 renderNav();const v=document.getElementById("view");
 if(active==="home")v.innerHTML=homeView();
 if(active==="food")v.innerHTML=foodView();
 if(active==="care")v.innerHTML=careView();
 if(active==="pets")v.innerHTML=petsView();
 if(active==="cage")v.innerHTML=cageView();
 if(active==="guide")v.innerHTML=guideView();
}
function homeView(){let today=tasks.filter(t=>t.due<=todayISO()&&!t.done).length;return `
 <section class="welcome"><div><div class="eyebrow">Willkommen bei ChinchiCare</div><h2>Für kleine Tiere,<br>mit großer Sorgfalt.</h2><p>Futterwissen, Pflege und Haltung übersichtlich an einem Ort. Starte mit deinem persönlichen Chinchilla-Profil.</p></div><div class="emoji">🐭</div></section>
 ${header("Deine Übersicht","Das Wichtigste auf einen Blick")}
 <div class="grid">
  <div class="card metric"><div class="metric-icon">♡</div><div><strong>${pets.length}</strong><span>Tierprofile</span></div></div>
  <div class="card metric"><div class="metric-icon">✓</div><div><strong>${today}</strong><span>Offene Aufgaben</span></div></div>
  <div class="card metric"><div class="metric-icon">♧</div><div><strong>${foods.length}</strong><span>Futtereinträge</span></div></div>
 </div>
 ${header("Schnellzugriff","Was möchtest du als Nächstes tun?")}
 <div class="quick">
  <button onclick="go('pets')"><span class="metric-icon">🐭</span><span><b>Chinchilla hinzufügen</b><br><span class="small muted">Profil und Gewichtsdaten dokumentieren</span></span></button>
  <button onclick="go('food')"><span class="metric-icon">🌿</span><span><b>Futter nachschlagen</b><br><span class="small muted">Hinweise und Vorsichtsmaßnahmen lesen</span></span></button>
  <button onclick="go('care')"><span class="metric-icon">📅</span><span><b>Pflegeaufgaben ansehen</b><br><span class="small muted">Aufgaben abhaken und eigene ergänzen</span></span></button>
 </div>
 <div class="notice"><b>Hinweis:</b> Dies ist ein früher Prototyp. Die Inhalte sind eine erste Orientierung und noch keine abschließend fachlich geprüfte Futterdatenbank. Bei Krankheitszeichen bitte eine chinchillaerfahrene Tierarztpraxis kontaktieren.</div>`}
function foodView(){let list=foods.filter(f=>(f.name+" "+f.group+" "+f.desc).toLowerCase().includes(foodQuery.toLowerCase()));return `${header("Futterlexikon","Erste Orientierung zu häufigen Futterthemen")}<input class="search" placeholder="Futter suchen …" value="${esc(foodQuery)}" oninput="foodQuery=this.value;render()"><div class="food-grid">${list.map((f,i)=>`<button class="food" onclick="foodDetail(${foods.indexOf(f)})"><h3>${esc(f.name)}</h3><p>${esc(f.desc)}</p><span class="pill ${f.tone==='warn'?'warn':''}">${esc(f.status)}</span></button>`).join("")||'<div class="empty">Keine passenden Einträge gefunden.</div>'}</div><div class="notice warn">Futtereinträge sind noch nicht vollständig wissenschaftlich geprüft. Keine Pflanze allein aufgrund eines unbestätigten Online-Tipps verfüttern.</div>`}
function foodDetail(i){const f=foods[i];modal(`<div class="modal-head"><h2>${esc(f.name)}</h2><button class="close" onclick="closeModal()">Schließen</button></div><p><span class="pill ${f.tone==='warn'?'warn':''}">${esc(f.status)}</span></p><p>${esc(f.desc)}</p><div class="notice">${esc(f.detail)}</div><p class="small muted">${esc(f.source)}</p><button class="btn" onclick="closeModal()">Verstanden</button>`)}
function careView(){let list=[...tasks].sort((a,b)=>a.due.localeCompare(b.due));return `${header("Pflegekalender","Aufgaben planen und abhaken",'<button class="btn" onclick="taskForm()">+ Aufgabe</button>')}<div class="notice">Die Aufgaben sind individuell anpassbare Organisationshilfen. Nicht jede Aufgabe muss bei jedem Tier gleich häufig durchgeführt werden.</div><div class="list">${list.map(t=>`<div class="item"><div style="display:flex;gap:11px;align-items:center;min-width:0"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id},this.checked)" aria-label="Aufgabe erledigt"><div><h3 style="${t.done?'text-decoration:line-through;color:#899083':''}">${esc(t.title)}</h3><p>${esc(t.category)} · ${esc(t.due)}</p></div></div><button class="btn ghost" onclick="deleteTask(${t.id})">Löschen</button></div>`).join("")||'<div class="empty">Noch keine Aufgaben. Lege deine erste Aufgabe an.</div>'}</div>`}
function taskForm(){modal(`<div class="modal-head"><h2>Neue Aufgabe</h2><button class="close" onclick="closeModal()">Schließen</button></div><form onsubmit="addTask(event)"><div class="field"><label>Aufgabe</label><input id="taskTitle" required placeholder="z. B. Gewicht kontrollieren"></div><div class="field"><label>Rhythmus</label><select id="taskCat"><option>Täglich</option><option>Wöchentlich</option><option>Monatlich</option><option>Einmalig</option></select></div><div class="field"><label>Fällig am</label><input id="taskDue" type="date" value="${todayISO()}" required></div><button class="btn" type="submit">Aufgabe speichern</button></form>`)}
function addTask(e){e.preventDefault();tasks.push({id:Date.now(),title:document.getElementById("taskTitle").value.trim(),category:document.getElementById("taskCat").value,due:document.getElementById("taskDue").value,done:false});save("tasks",tasks);closeModal();render()}
function toggleTask(id,done){tasks=tasks.map(t=>t.id===id?{...t,done}:t);save("tasks",tasks);render()}
function deleteTask(id){if(confirm("Diese Aufgabe wirklich löschen?")){tasks=tasks.filter(t=>t.id!==id);save("tasks",tasks);render()}}
function petsView(){return `${header("Meine Chinchillas","Profile, Gewicht und persönliche Notizen",'<button class="btn" onclick="petForm()">+ Tier hinzufügen</button>')}<div class="notice">Gewichtsverläufe und Notizen helfen bei der Dokumentation, ersetzen aber keine tierärztliche Untersuchung.</div>${pets.length?`<div class="list">${pets.map(p=>`<div class="card"><div class="pet-row"><div class="pet-avatar">🐭</div><div style="flex:1"><h3 style="margin:0">${esc(p.name)}</h3><div class="small muted">${esc(p.sex||"Geschlecht nicht angegeben")}${p.birth?" · Geboren: "+esc(p.birth):""}</div></div><button class="btn ghost" onclick="weightForm(${p.id})">Gewicht</button><button class="btn danger" onclick="deletePet(${p.id})">Löschen</button></div>${p.weight?`<p class="small">Letztes Gewicht: <b>${esc(p.weight)} g</b>${p.weightDate?" · "+esc(p.weightDate):""}</p>`:""}${p.notes?`<p class="small muted">${esc(p.notes)}</p>`:""}${p.history?.length?`<details><summary class="small">Gewichtsverlauf (${p.history.length})</summary><div class="list" style="margin-top:8px">${p.history.slice().reverse().map(h=>`<div class="item"><span>${esc(h.date)}</span><b>${esc(h.weight)} g</b></div>`).join("")}</div></details>`:""}</div>`).join("")}</div>`:'<div class="empty"><div style="font-size:32px">🐭</div><h3>Noch keine Tierprofile</h3><p>Lege ein Profil an, um Daten und Gewicht zu dokumentieren.</p><button class="btn" onclick="petForm()">Erstes Tier hinzufügen</button></div>'}`}
function petForm(){modal(`<div class="modal-head"><h2>Chinchilla-Profil</h2><button class="close" onclick="closeModal()">Schließen</button></div><form onsubmit="addPet(event)"><div class="field"><label>Name *</label><input id="petName" required maxlength="50" placeholder="Name des Tieres"></div><div class="field"><label>Geschlecht</label><select id="petSex"><option>Nicht angegeben</option><option>Weiblich</option><option>Männlich</option></select></div><div class="field"><label>Geburtsdatum (optional)</label><input id="petBirth" type="date"></div><div class="field"><label>Aktuelles Gewicht in Gramm (optional)</label><input id="petWeight" type="number" min="1" max="3000" placeholder="z. B. 520"></div><div class="field"><label>Datum der Gewichtsmessung</label><input id="petWeightDate" type="date" value="${todayISO()}"></div><div class="field"><label>Notizen</label><textarea id="petNotes" placeholder="Besonderheiten, Herkunft, Beobachtungen …"></textarea></div><button class="btn" type="submit">Profil speichern</button></form>`)}
function addPet(e){e.preventDefault();let w=document.getElementById("petWeight").value;let p={id:Date.now(),name:document.getElementById("petName").value.trim(),sex:document.getElementById("petSex").value,birth:document.getElementById("petBirth").value,weight:w,weightDate:document.getElementById("petWeightDate").value,notes:document.getElementById("petNotes").value.trim(),history:w?[{date:document.getElementById("petWeightDate").value,weight:w}]:[]};pets.push(p);save("pets",pets);closeModal();render()}
function weightForm(id){const p=pets.find(p=>p.id===id);modal(`<div class="modal-head"><h2>Gewicht dokumentieren</h2><button class="close" onclick="closeModal()">Schließen</button></div><p>${esc(p.name)}</p><form onsubmit="addWeight(event,${id})"><div class="field"><label>Gewicht in Gramm</label><input id="newWeight" type="number" min="1" max="3000" required value="${esc(p.weight||"")}"></div><div class="field"><label>Messdatum</label><input id="newWeightDate" type="date" value="${todayISO()}" required></div><button class="btn" type="submit">Eintrag speichern</button></form>`)}
function addWeight(e,id){e.preventDefault();const p=pets.find(p=>p.id===id),w=document.getElementById("newWeight").value,d=document.getElementById("newWeightDate").value;p.weight=w;p.weightDate=d;p.history=p.history||[];p.history.push({date:d,weight:w});save("pets",pets);closeModal();render()}
function deletePet(id){if(confirm("Tierprofil und zugehörige Gewichtsnotizen löschen?")){pets=pets.filter(p=>p.id!==id);save("pets",pets);render()}}
function cageView(){return `${header("Käfigplanung","Maße und Einrichtung für deine Dokumentation")}<div class="two"><section class="card"><h3 style="margin-top:0">Gehege-Maße</h3><p class="small muted">Trage die Innenmaße in Zentimetern ein. Die App bewertet die Maße noch nicht automatisch.</p><form onsubmit="saveCage(event)"><div class="field"><label>Breite (cm)</label><input id="cWidth" type="number" min="1" value="${esc(cage.width)}" placeholder="z. B. 180"></div><div class="field"><label>Tiefe (cm)</label><input id="cDepth" type="number" min="1" value="${esc(cage.depth)}" placeholder="z. B. 80"></div><div class="field"><label>Höhe (cm)</label><input id="cHeight" type="number" min="1" value="${esc(cage.height)}" placeholder="z. B. 160"></div><div class="field"><label>Notizen zur Einrichtung</label><textarea id="cNotes" placeholder="Ebenen, Rückzugsorte, sichere Materialien …">${esc(cage.notes)}</textarea></div><button class="btn" type="submit">Angaben speichern</button></form></section><section class="card"><h3 style="margin-top:0">Sicherheits-Checkliste</h3><p class="small muted">Zum Abhaken für die eigene Prüfung.</p>${["Stabile, sichere Verschlüsse","Keine scharfen Kanten oder herausstehenden Schrauben","Rückzugsorte und erhöhte Sitzflächen","Geeignete, unbehandelte Materialien geprüft","Ausreichende Belüftung und Schutz vor direkter Sonne","Temperatur im Raum beobachtet","Wasser und Heu gut erreichbar"].map((x,i)=>`<label class="checkline"><input type="checkbox" id="cCheck${i}" onchange="saveCheck(${i},this.checked)" ${read("checks",[]).includes(i)?"checked":""}><span>${x}</span></label>`).join("")}</section></div><div class="notice warn">Es gibt hier bewusst noch keine automatische Freigabe oder Bewertung des Geheges. Mindestmaße und Materialempfehlungen müssen anhand belastbarer Tierschutz- und Fachquellen ergänzt werden.</div>`}
function saveCage(e){e.preventDefault();cage={width:document.getElementById("cWidth").value,depth:document.getElementById("cDepth").value,height:document.getElementById("cHeight").value,notes:document.getElementById("cNotes").value};save("cage",cage);render();alert("Käfigangaben gespeichert.")}
function saveCheck(i,on){let a=read("checks",[]);a=on?[...new Set([...a,i])]:a.filter(x=>x!==i);save("checks",a)}
function guideView(){return `${header("Haltungswissen","Die wichtigsten Themen als erste Orientierung")}<div class="list">${[
["🌡️","Temperatur und Raumklima","Chinchillas reagieren empfindlich auf Hitze. Raumtemperatur beobachten, direkte Sonne vermeiden und bei Wärmeproblemen frühzeitig fachlichen Rat einholen."],
["🪵","Einrichtung und Beschäftigung","Sichere Rückzugsorte, stabile Ebenen und geeignete Beschäftigung ermöglichen. Beschädigte oder angeknabberte Teile regelmäßig prüfen."],
["🧼","Sandbad und Fellpflege","Geeignetes Chinchilla-Badesubstrat verwenden und Zustand von Fell und Haut beobachten. Bei Veränderungen tierärztlich beraten lassen."],
["🩺","Gesundheitskontrolle","Appetit, Kotabsatz, Aktivität, Atmung und Gewicht beobachten. Bei Fressunlust, deutlich verändertem Kot oder Atemproblemen rasch eine chinchillaerfahrene Praxis kontaktieren."],
["🤝","Sozialverhalten","Chinchillas sind soziale Tiere. Zusammenführung und Gruppenkonstellationen sorgfältig planen und bei Konflikten fachkundige Beratung einholen."]
].map(x=>`<article class="card"><div class="pet-row" style="align-items:flex-start"><div class="metric-icon">${x[0]}</div><div><h3 style="margin:0 0 5px">${x[1]}</h3><p class="muted" style="margin:0;font-size:13px">${x[2]}</p></div></div></article>`).join("")}</div><div class="notice">Die Ratgebertexte sind bewusst vorsichtig formuliert. Vor einer Veröffentlichung müssen sie fachlich geprüft, mit Quellen versehen und regelmäßig aktualisiert werden.</div>`}
function modal(content){document.getElementById("modalRoot").innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
render();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(() => {}));
}
</script>
</body>
</html>
